<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-title">
        <h1>Task Dashboard</h1>
        <p>Manage your daily activities and stay organized</p>
      </div>
      <div class="header-date" id="current-date"></div>
    </header>

    <!-- Dashboard Overview Stats Cards -->
    <section class="stats-section">
      <div class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="stat-pending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="stat-completed">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">High Priority</span>
        <span class="stat-value stat-high" id="stat-high">0</span>
      </div>
    </section>

    <!-- Overall Progress Bar -->
    <section class="progress-section">
      <div class="progress-info">
        <span>Completion Progress</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </section>

    <!-- Add Task Form -->
    <section class="card form-section">
      <h2>Add New Task</h2>
      <form id="task-form">
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="task-title">Task Name</label>
            <input type="text" id="task-title" placeholder="e.g., Prepare project report..." required>
          </div>
          <div class="form-group flex-1">
            <label for="task-category">Category</label>
            <select id="task-category">
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date">
          </div>
          <div class="form-group form-button-group">
            <button type="submit" id="add-btn" class="btn btn-primary">Add Task</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Filter & Search Controls Toolbar -->
    <section class="controls-section">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search tasks...">
      </div>

      <div class="filter-group">
        <div class="status-filters" id="status-filters">
          <button class="filter-btn active" data-status="all">All</button>
          <button class="filter-btn" data-status="active">Active</button>
          <button class="filter-btn" data-status="completed">Completed</button>
        </div>

        <select id="filter-priority" class="select-filter">
          <option value="all">All Priorities</option>
          <option value="High">High Priority</option>
          <option value="Medium">Medium Priority</option>
          <option value="Low">Low Priority</option>
        </select>

        <select id="filter-category" class="select-filter">
          <option value="all">All Categories</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Other">Other</option>
        </select>

        <button id="clear-completed-btn" class="btn btn-secondary">Clear Completed</button>
      </div>
    </section>

    <!-- Task List Container -->
    <section class="task-list-section">
      <div id="task-list" class="task-list">
        <!-- Task Cards will be rendered dynamically here -->
      </div>
      <div id="empty-state" class="empty-state">
        <p>No tasks found. Add a new task above to get started!</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
